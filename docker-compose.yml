services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alphamarket
      POSTGRES_PASSWORD: alphamarket
      POSTGRES_DB: alphamarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphamarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway DB for integration tests. No volume: state is disposable by design.
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: alphamarket
      POSTGRES_PASSWORD: alphamarket
      POSTGRES_DB: alphamarket_test
    ports:
      - "5433:5432"

volumes:
  pgdata:
