# Fly.io deployment (BUILD_PLAN M4.4; docs/deploy.md). Three process GROUPS
# from the one Dockerfile image, sharing Fly Managed Postgres as DATABASE_URL:
#   web    -- runs migrations then serves HTTP (the only group with a
#             http_service / public port below)
#   worker -- python -m alphamarket.worker: polling, nightly reconcile,
#             stats, incubation promotion. No http_service: it takes no
#             inbound traffic, so `fly scale count worker=N` never opens a
#             port for it.
#   stream -- OPTIONAL (P7): python -m alphamarket.stream holds websockets
#             for creators with active paper allocations so copies lag by
#             seconds, not minutes (docs/worker.md "Streaming"). Outbound
#             only, no http_service. The poller stays the source of truth:
#             `fly scale count stream=0` turns it off with no other effect.
#             Several machines are safe (Postgres leases); all machines
#             behind one egress IP share Hyperliquid's 10-user websocket cap.
# Secrets set with `fly secrets set`:
#   SECRET_KEY, VAULT_KEY, DATABASE_URL, KALSHI_ENV=prod, SECURE_COOKIES=true
#
# Static egress IP (platform_plan/implementation_plan section 2): Kraken,
# Coinbase and Binance.US let users restrict a key to an IP allowlist, and
# it's published on /security so users can do that. Allocate one per region
# BEFORE connecting real venue keys in prod (not run here -- do it by hand):
#   fly ips allocate-egress -r iad
# This assigns a static IPv4 (and IPv6) that every machine in that region
# shares as its outbound source address; see implementation_plan.md 2.3 for
# how many wallets/keys one IP can poll before it becomes a limiter.
app = "koine"
primary_region = "iad"

[build]

[processes]
  web = "sh -c 'alembic upgrade head && uvicorn alphamarket.main:app --host 0.0.0.0 --port 8080'"
  worker = "python -m alphamarket.worker"
  stream = "python -m alphamarket.stream"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["stream"]

# Non-secret feature flags (config.py). Vault a feature by flipping it here
# and running `fly deploy`.
[env]
  WATCH_DISCOVER_ENABLED = "true"  # /watch/discover (copy strategies step 7)
  WATCH_VENUES = "hyperliquid,polymarket"  # watchable + discoverable venues; drop one to vault it
