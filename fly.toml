# Fly.io deployment (BUILD_PLAN M4.4). One web process, one worker process,
# managed Postgres attached as DATABASE_URL. Secrets set with `fly secrets set`:
#   SECRET_KEY, VAULT_KEY, DATABASE_URL, KALSHI_ENV=prod, SECURE_COOKIES=true
app = "alphamarket"
primary_region = "iad"

[build]

[processes]
  web = "sh -c 'alembic upgrade head && uvicorn alphamarket.main:app --host 0.0.0.0 --port 8080'"
  worker = "python -m alphamarket.worker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
