[alembic]
script_location = alembic
# URL is read from Settings (DATABASE_URL) in alembic/env.py; this is a fallback.
sqlalchemy.url = postgresql+psycopg://alphamarket:alphamarket@localhost:5432/alphamarket

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
