version: 2
updates:
  # Python dependencies, resolved via uv (uv.lock). Dependabot understands
  # pyproject.toml + uv.lock through the "uv" ecosystem.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
