<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AlphaMarket{% endblock %}</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#262a36; --text:#e6e8ef; --muted:#8b93a7;
          --accent:#4f8cff; --good:#2fbf71; --bad:#e5484d; --warn:#f5a524; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); }
  header .brand { font-weight:700; letter-spacing:.3px; color:var(--text); }
  main { max-width:1040px; margin:0 auto; padding:24px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  h1 { font-size:26px; margin:0 0 6px; } h2 { font-size:17px; margin:0 0 12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .tile .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .tile .v { font-size:22px; font-weight:600; margin-top:2px; }
  .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; border:1px solid var(--line); margin-right:6px; background:var(--bg); }
  .badge.good { border-color:var(--good); } .badge.warn { border-color:var(--warn); } .badge.bad { border-color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  input, textarea, select { width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:90px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:13px; }
  button { padding:9px 14px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); border-color:var(--line); }
  button.danger { background:transparent; color:var(--bad); border-color:var(--bad); }
  form.inline { display:inline; }
  .error { background:#3a1d20; border:1px solid var(--bad); color:#ffb4b7; padding:10px 12px; border-radius:8px; margin-bottom:14px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; } @media (max-width:800px) { .grid2 { grid-template-columns:1fr; } }
  .unverified { border-left:3px solid var(--warn); padding:10px 14px; background:var(--bg); border-radius:0 8px 8px 0; }
  canvas { max-height:280px; }
  .months td { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">AlphaMarket</a>
  <nav class="small">
    <a href="/methodology">Methodology</a>
    {% if request.session.get("user_id") %}
      &nbsp;·&nbsp; <a href="/dashboard">Dashboard</a>
      &nbsp;·&nbsp; <form class="inline" method="post" action="/logout-form"><button class="secondary" type="submit">Log out</button></form>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
